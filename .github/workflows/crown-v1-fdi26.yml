name: Crown v1 FDI26 regression

on:
  pull_request:
    paths:
      - "backend/app/geometry/crown_outer/**"
      - "backend/app/geometry/scan_pair_triage.py"
      - "backend/app/services/auto_fit_templates.py"
      - "backend/app/services/axial_placement.py"
      - "backend/app/services/sectional_generation.py"
      - "backend/app/services/generation_workflow.py"
      - "backend/tools/run_fdi26_private_regression.py"
      - "backend/tests/integration/test_a0_draft_template_identity.py"
      - "backend/tests/integration/test_a1_placement_parity.py"
      - "backend/tests/integration/test_sectional_generation_dispatch.py"
      - "backend/tests/unit/geometry/test_axial_placement.py"
      - "backend/tests/unit/geometry/test_crown_outer_confirmed_frame.py"
      - "backend/tests/unit/geometry/test_margin_contract.py"
      - "backend/tests/unit/geometry/test_proximal_patch_broadening.py"
      - "backend/tests/unit/geometry/test_scan_pair_triage.py"
      - "backend/tests/unit/geometry/test_a0_patient_frame.py"
      - "backend/tests/unit/geometry/test_sectional_crown_v1.py"
      - ".github/workflows/crown-v1-fdi26.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-geometry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            scipy==1.17.1 \
            trimesh==5.0.0 \
            rtree==1.4.1 \
            mapbox-earcut==2.1.0 \
            pytest==9.0.2
      - name: Compile private FDI26 runner
        run: python -m py_compile tools/run_fdi26_private_regression.py
      - name: Run Crown 1.0 focused regressions
        run: |
          pytest -q \
            tests/unit/geometry/test_axial_placement.py \
            tests/unit/geometry/test_crown_outer_confirmed_frame.py \
            tests/unit/geometry/test_margin_contract.py \
            tests/unit/geometry/test_proximal_patch_broadening.py \
            tests/unit/geometry/test_scan_pair_triage.py \
            tests/unit/geometry/test_a0_patient_frame.py \
            tests/unit/geometry/test_sectional_crown_v1.py

  live-placement-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run live placement truth-source regressions
        run: |
          pytest -q \
            tests/integration/test_a0_draft_template_identity.py \
            tests/integration/test_a1_placement_parity.py \
            tests/integration/test_sectional_generation_dispatch.py
